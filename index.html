<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英语 3000 词</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="app-title">英语 3000 词</h1>
  </header>
  <main>
    <section class="view" id="view-today">
      <h2>今天</h2>
      <div id="today-info"></div>
      <div id="phonics-list"></div>
      <div id="daily-checks"></div>
      <div id="today-words"></div>
      <div id="listening-box"></div>
      <div id="today-overview"></div>
      <div id="writing-box" hidden>
        <div id="writing-task"></div>
        <p>今日作文（写在下面，点保存）：</p>
        <textarea id="writing-text" rows="6"></textarea>
        <button id="save-writing-btn">保存作文</button>
        <p id="writing-msg"></p>
      </div>
      <button id="complete-today-btn">完成今天</button>
      <p id="complete-today-msg"></p>
    </section>
    <section class="view" id="view-review">
      <h2>复习</h2>
      <div id="review-list"></div>
    </section>
    <section class="view" id="view-words">
      <h2>单词</h2>
      <div id="words-summary"></div>
      <p>分类：<select id="words-category"><option value="all">全部</option><option value="名词">名词</option><option value="动词">动词</option><option value="形容词">形容词</option><option value="副词">副词</option></select></p>
      <p>状态：<select id="words-state"><option value="all">全部</option><option value="unlearned">未学</option><option value="queued">待学</option><option value="learning">学习中</option><option value="mastered">已掌握</option></select></p>
      <div id="words-list"></div>
      <p id="words-more"></p>
    </section>
    <section class="view" id="view-test">
      <h2>检查</h2>
      <p id="test-status"></p>
      <button id="start-exam-btn">开始检查</button>
      <div id="exam-area" hidden>
        <p id="exam-progress"></p>
        <p id="exam-question"></p>
        <input id="exam-input" type="text" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button id="exam-submit-btn">提交</button>
        <button id="exam-reveal-btn">显示释义</button>
        <button id="exam-know-btn">记得</button>
        <button id="exam-forget-btn">不记得</button>
      </div>
      <p id="exam-result"></p>
    </section>
    <section class="view" id="view-settings">
      <h2>设置</h2>
      <label>计划开始日期 <input type="date" id="start-date"></label>
      <button id="save-start-date">保存</button>
      <p id="start-date-msg"></p>
      <h3>备份与恢复</h3>
      <p id="backup-status"></p>
      <button id="export-backup-btn">导出备份</button>
      <textarea id="backup-text" rows="6"></textarea>
      <button id="import-backup-btn">导入备份</button>
      <p id="backup-msg"></p>
      <h3>清空数据</h3>
      <button id="clear-data-btn">清空全部数据</button>
      <p id="clear-data-msg"></p>
      <h3>进度</h3>
      <p id="progress-info"></p>
      <button id="undo-complete-btn" hidden>重做今天</button>
      <p id="undo-complete-msg"></p>
      <h3>发音方式</h3>
      <p id="voice-mode-status"></p>
      <button id="voice-mode-btn">切换发音方式</button>
      <p id="voice-mode-msg"></p>
      <h3>发音口音</h3>
      <p id="accent-status"></p>
      <button id="accent-btn">切换口音</button>
      <p id="accent-msg"></p>
    </section>
  </main>
  <nav id="main-nav">
    <button class="nav-btn" data-view="today">今天</button>
    <button class="nav-btn" data-view="review">复习</button>
    <button class="nav-btn" data-view="words">单词</button>
    <button class="nav-btn" data-view="test">检查</button>
    <button class="nav-btn" data-view="settings">设置</button>
  </nav>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
